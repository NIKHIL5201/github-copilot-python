<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <script>
    (function () {
      const savedTheme = localStorage.getItem('sudokuTheme') || 'light';
      document.documentElement.dataset.theme = savedTheme;
    }());
  </script>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="Easy">Easy</option>
      <option value="Medium" selected>Medium</option>
      <option value="Hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <button id="theme-toggle" type="button" aria-label="Switch to dark mode">
      Dark Mode
    </button>
    <span class="timer-label">Time: <strong id="timer">00:00</strong></span>
    <span id="message"></span>
  </div>
  <section class="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10</h2>
    <table>
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Name</th>
          <th scope="col">Time</th>
          <th scope="col">Difficulty</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
